name: therapy_outcomes
version: "1.0.0"
profile: therapy_outcomes

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  therapy_outcomes:
    staging:
      +materialized: view
    marts:
      +materialized: table

vars:
  # NHS Talking Therapies thresholds
  phq9_caseness: 10
  gad7_caseness: 8
  phq9_reliable_change: 6
  gad7_reliable_change: 4
  # sessions counted as "early" for engagement and early-change features
  early_window: 3
